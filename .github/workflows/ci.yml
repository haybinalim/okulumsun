name: ci
on:
  push:
  pull_request:
jobs:
  dogrula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - name: ffmpeg kur (ses denetimi için)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run lint
      - run: npm test
      - run: npm run validate
      # K8 bayatlık kapısı (plan v2 Adım 19): PROGRESS/PLAN sayıları ve §12 ağacı kodla eşleşmeli.
      - run: npm run durum -- --denetle
      # K10 lisans envanteri (plan v2 Adım 21): bağımlılık/font/ses ↔ envanter ↔ LICENSES.md.
      - run: npm run lisans:denetle
      - run: npm run gizlilik:tara
      # K4 tam (Adım 31): geçiş istisnası yok — her özet aktif kaynakla (Google Chirp 3 HD Puck) eşleşir.
      - run: npm run audio:audit
      - run: npm run build
      # K5 boyut bütçesi (plan v2 Adım 26): v0.3.0'a kadar uyarı, sonra +%10 aşım hata.
      - run: npm run boyut
      # E2E kancası (src/dev/e2eKanca.ts) üretim derlemesine girmemeli (KG-38).
      - name: E2E kancası üretimde yok
        run: "! grep -rq __okulumsunE2E dist/"
      # Adım 49 (KG-71): okul ağı paketi; yalnız main'de artefakt (Release eki yok — kurum dağıtımı yazılı izin ister).
      - name: Okul paketi
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run okul-paketi
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: okul-paketi
          path: dist-okul.zip
          retention-days: 30
  e2e:
    runs-on: ubuntu-latest
    # Adım 26: main'e push'ta ve PR'da koşar (diğer dallardaki push'lar PR ile sınanır).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        proje: [board, tablet, onizleme]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - name: Playwright tarayıcı önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.proje }}
      # Adım 54: kırmızı e2e'de iz (trace) ve hata bağlamı indirilebilsin (yalnız başarısızlıkta, 7 gün).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-sonuclari-${{ matrix.proje }}
          path: test-results/
          retention-days: 7
      # Adım 39 (KG-54): gizlilik e2e kayıtlarından insan okur kanıt raporu; temiz değilse adım kırmızı.
      - name: Gizlilik kanıt raporu
        if: matrix.proje == 'onizleme'
        run: npm run gizlilik:rapor
      - uses: actions/upload-artifact@v4
        if: matrix.proje == 'onizleme'
        with:
          name: gizlilik-kanit-raporu
          path: docs/gizlilik/kanit-raporu.md
