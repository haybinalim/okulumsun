name: ci
on:
  push:
  pull_request:
jobs:
  dogrula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - name: ffmpeg kur (ses denetimi için)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run lint
      - run: npm test
      - run: npm run validate
      # K8 bayatlık kapısı (plan v2 Adım 19): PROGRESS/PLAN sayıları ve §12 ağacı kodla eşleşmeli.
      - run: npm run durum -- --denetle
      # K10 lisans envanteri (plan v2 Adım 21): bağımlılık/font/ses ↔ envanter ↔ LICENSES.md.
      - run: npm run lisans:denetle
      - run: npm run audio:audit
        env:
          # ADR-0004 / Adım 31'de kaldırılacak: mevcut kliplerin ticari dağıtım izni yok (geçiş istisnası).
          SES_GECIS_MODU: '1'
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
