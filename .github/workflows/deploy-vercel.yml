# Kanonik yayın: Vercel (ADR-0003, plan v2 Adım 22, K11).
# Yayın yalnız `ci` iş akışı BAŞARIYLA bittiğinde çalışır; kırmızı CI'da yayın olmaz.
# main → üretim (okulumsun-tc.vercel.app); aynı depodan açılan PR → önizleme + PR yorumu.
# Vercel'in Git otomatik yayını vercel.json'da kapalı (`git.deploymentEnabled: false`).
# Gerekli depo sırları: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (docs/yayin.md).
name: deploy-vercel

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  yayin:
    # Yeşil CI + yalnız bu depodan gelen dallar (fork kodu sırlarla derlenmez).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      URETIM: ${{ github.event.workflow_run.event == 'push' }}
    steps:
      - name: Sırlar tanımlı mı?
        id: sir
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID tanımlı değil; yayın atlandı (docs/yayin.md)."
            echo "var=false" >> "$GITHUB_OUTPUT"
          else
            echo "var=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.sir.outputs.var == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - if: steps.sir.outputs.var == 'true'
        uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - if: steps.sir.outputs.var == 'true'
        run: npm ci
      - name: Vercel derle ve yayınla
        if: steps.sir.outputs.var == 'true'
        id: vercel
        run: |
          ORTAM=preview; BAYRAK=""
          if [ "$URETIM" = "true" ]; then ORTAM=production; BAYRAK="--prod"; fi
          npx --yes vercel@latest pull --yes --environment=$ORTAM --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build $BAYRAK --token="$VERCEL_TOKEN"
          URL=$(npx --yes vercel@latest deploy --prebuilt $BAYRAK --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Yayın ($ORTAM): $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Önizleme adresini PR'a yaz
        if: steps.sir.outputs.var == 'true' && env.URETIM != 'true' && github.event.workflow_run.pull_requests[0].number
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.workflow_run.pull_requests[0].number }},
              body: `Önizleme (yeşil CI sonrası, \`${{ github.event.workflow_run.head_sha }}\`): ${{ steps.vercel.outputs.url }}`,
            });
